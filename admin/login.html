<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>Admin Giriş | Ember Sofrası</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin-style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <!-- Logo -->
      <div class="auth-logo">
        <svg viewBox="0 0 48 48" class="flame-icon">
          <path d="M24 4c2 6-4 8-4 14 0 3 2 5 4 5s4-2 4-5c3 3 5 7 5 11 0 7-6 12-13 12S7 34 7 27c0-9 7-14 9-20 1 3 0 6 2 7 1-4-1-6 0-10 2 3 4 5 6 0z"/>
        </svg>
      </div>

      <!-- Başlık -->
      <h1 class="auth-title">Ember Sofrası Admin</h1>
      <p class="auth-subtitle">Restoranınızı yönetin</p>

      <!-- Giriş Formu -->
      <form id="loginForm" class="auth-form">
        <!-- E-posta -->
        <div class="form-group">
          <label for="email">E-posta Adresiniz</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="admin@example.com"
            required
            aria-label="E-posta adresiniz"
          />
        </div>

        <!-- Şifre -->
        <div class="form-group">
          <label for="password">Şifre</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="••••••••"
            required
            aria-label="Şifre"
          />
        </div>

        <!-- Hata Mesajı -->
        <div id="errorMessage" class="error-message" role="alert" aria-live="polite"></div>

        <!-- Giriş Yap Butonu -->
        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
          <span class="btn-text">Giriş Yap</span>
          <span class="btn-loader" id="btnLoader" style="display: none;">
            <svg class="spinner" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" />
            </svg>
          </span>
        </button>
      </form>

      <!-- Şifremi Unuttum -->
      <div class="auth-footer">
        <a href="forgot-password.html" class="forgot-password-link">Şifremi Unuttum</a>
      </div>

      <!-- Test Bilgileri (Development Only) -->
      <div class="dev-info">
        <p><strong>Test Hesabı:</strong></p>
        <p>E-posta: <code>admin@example.com</code></p>
        <p>Şifre: <code>Test123!</code></p>
        <small>(Üretim ortamında kaldırılacak)</small>
      </div>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
